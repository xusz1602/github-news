name: Publish Card Reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'config.json', '.github/workflows/preview.yml']
  workflow_run:
    workflows: ['GitHub Embedded Radar', 'Send Requested Report']
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: github-radar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Build cards and README excerpts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/main.mjs preview
      - name: Save readable reports and excerpt cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs reports data/readme-excerpts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update card reports and README excerpts"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
