name: Resend Latest Card Report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/resend-preview.yml']
permissions:
  contents: write
concurrency:
  group: github-radar
  cancel-in-progress: false
jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Verify card URL and resend latest report
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node src/main.mjs resend
      - name: Save resend receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "Record requested card report resend"
            git pull --rebase origin main
            git push
          fi
