name: Send Requested Report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['reports/manual-*.md']
permissions:
  contents: write
concurrency:
  group: github-radar
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send requested report to personal WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node src/main.mjs send
      - name: Save delivery receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if test -f data/delivery.json; then git add data/delivery.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record requested report notification acceptance"
            git pull --rebase origin main
            git push
          fi
