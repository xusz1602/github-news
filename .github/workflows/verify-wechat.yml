name: Verify WeChat Connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-wechat.yml']
permissions:
  contents: write
concurrency:
  group: github-radar
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send connection test to personal WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node src/main.mjs test-push
      - name: Record API acceptance without secrets
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.mkdirSync('data',{recursive:true}); fs.writeFileSync('data/wechat-verification.json', JSON.stringify({status:'api-accepted',at:new Date().toISOString(),run:process.env.GITHUB_RUN_ID})+'\n');"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wechat-verification.json
          git commit -m "Record WeChat connection test acceptance"
          git pull --rebase origin main
          git push
